[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-ids"
version = "0.1.0"
description = "SAGE-IDS: Self-Evolving Cyber Defense through Closed-Loop Multi-Agent Adversarial Validation and Adaptive Intrusion Detection (research prototype)"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Anand Rawat" },
  { name = "Anandi Singh" },
  { name = "Ananya Agarwal" },
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.35",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packet = ["scapy>=2.5"]   # real loopback packet capture (requires Npcap with loopback support)

[project.scripts]
sage-ids = "sage_ids.cli:main"

[tool.setuptools.packages.find]
include = ["sage_ids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "lab: runs a real loopback laboratory (slow, ~1-2 min)",
    "packet: requires scapy + Npcap loopback capture",
]
